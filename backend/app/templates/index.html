<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SiteMind AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>

  <body class="bg-[#202123] text-white font-[Inter]">
    <div class="flex h-screen overflow-hidden">
      <aside
        id="sidebar"
        class="sidebar bg-[#171717] border-r border-[#2f2f2f] flex flex-col"
      >
        <div class="p-4">
          <button
            id="newChatBtn"
            class="w-full rounded-lg bg-green-600 hover:bg-green-700 transition py-3 font-semibold"
          >
            + New Chat
          </button>
        </div>

        <div id="chatList" class="flex-1 overflow-y-auto px-2"></div>

        <div class="border-t border-[#2f2f2f] p-4">
          <button
            id="logoutBtn"
            class="hidden w-full text-left text-sm text-gray-300 hover:text-white"
          >
            Logout
          </button>
          <div id="userInfo" class="text-sm text-gray-400">Not logged in</div>
        </div>
      </aside>

      <main class="flex-1 flex flex-col min-w-0">
        <header
          class="h-16 border-b border-[#2f2f2f] flex items-center justify-between px-4 md:px-6"
        >
          <div class="flex items-center gap-3">
            <button
              id="sidebarToggleBtn"
              class="md:hidden rounded-lg bg-[#2b2b2b] px-3 py-2 text-lg leading-none"
            >
              ☰
            </button>
            <h1 class="font-semibold text-lg">SiteMind AI</h1>
          </div>

          <div class="flex items-center gap-2 md:gap-3">
            <select
              id="providerSelect"
              class="bg-[#2b2b2b] border border-[#3a3a3a] rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none"
            >
              <option value="ollama">Ollama</option>
              <option value="groq">Groq</option>
            </select>

            <select
              id="modelSelect"
              class="max-w-[120px] md:max-w-none bg-[#2b2b2b] border border-[#3a3a3a] rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none"
            ></select>
            <select
              id="sourceSelect"
              class="max-w-[140px] md:max-w-none bg-[#2b2b2b] border border-[#3a3a3a] rounded-lg px-2 md:px-3 py-2 text-xs md:text-sm outline-none"
            >
              <option value="">Source</option>
            </select>

            <button
              id="openAuthBtn"
              class="rounded-lg bg-green-600 hover:bg-green-700 px-3 md:px-4 py-2 text-xs md:text-sm font-semibold"
            >
              Login
            </button>
          </div>
        </header>

        <section id="chatContainer" class="flex-1 overflow-y-auto">
          <div
            id="welcomeScreen"
            class="h-full flex flex-col justify-center items-center text-center px-4"
          >
            <h2 class="text-4xl md:text-5xl font-bold">SiteMind AI</h2>
            <p class="text-gray-400 mt-3 text-sm md:text-base">
              Add a website URL, index it, then ask questions from that source.
            </p>

            <div class="mt-8 w-full max-w-2xl px-4">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input
                  id="sourceNameInput"
                  class="md:col-span-1 bg-[#2b2b2b] border border-[#3a3a3a] rounded-xl px-4 py-3 outline-none"
                  placeholder="Name e.g. LICT"
                />

                <input
                  id="sourceUrlInput"
                  class="md:col-span-2 bg-[#2b2b2b] border border-[#3a3a3a] rounded-xl px-4 py-3 outline-none"
                  placeholder="Website URL e.g. https://lict.edu.np"
                />
              </div>

              <button
                id="indexWebsiteBtn"
                class="mt-3 w-full rounded-xl bg-green-600 hover:bg-green-700 py-3 font-semibold"
              >
                Index Website
              </button>

              <p id="indexStatus" class="mt-3 text-sm text-gray-400"></p>
            </div>
          </div>

          <div
            id="messages"
            class="hidden max-w-4xl mx-auto px-4 md:px-6 py-6 md:py-8"
          ></div>
        </section>

        <footer class="p-3 md:p-6">
          <div class="max-w-4xl mx-auto">
            <div class="flex bg-[#2b2b2b] rounded-xl border border-[#3a3a3a]">
              <textarea
                id="messageInput"
                rows="1"
                placeholder="Message SiteMind AI..."
                class="flex-1 resize-none bg-transparent outline-none px-4 md:px-5 py-4 text-sm md:text-base"
              ></textarea>

              <button
                id="sendBtn"
                class="px-4 md:px-6 text-green-500 hover:text-green-400 transition"
              >
                Send
              </button>
            </div>
          </div>
        </footer>
      </main>
    </div>

    <div
      id="authModal"
      class="fixed inset-0 hidden items-center justify-center bg-black/70 z-50 px-4"
    >
      <div
        class="w-full max-w-md rounded-2xl bg-[#171717] border border-[#333] p-6 shadow-2xl"
      >
        <div class="flex justify-between items-center mb-5">
          <h2 id="authTitle" class="text-2xl font-bold">Login</h2>
          <button
            id="closeAuthBtn"
            class="text-gray-400 hover:text-white text-xl"
          >
            ×
          </button>
        </div>

        <div
          id="authError"
          class="hidden mb-4 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 px-4 py-3 text-sm"
        ></div>

        <input
          id="usernameInput"
          class="hidden w-full mb-3 rounded-lg bg-[#242424] border border-[#3a3a3a] px-4 py-3 outline-none"
          placeholder="Username"
        />
        <input
          id="emailInput"
          class="w-full mb-3 rounded-lg bg-[#242424] border border-[#3a3a3a] px-4 py-3 outline-none"
          placeholder="Email"
        />
        <input
          id="passwordInput"
          type="password"
          class="w-full mb-4 rounded-lg bg-[#242424] border border-[#3a3a3a] px-4 py-3 outline-none"
          placeholder="Password"
        />

        <button
          id="authSubmitBtn"
          class="w-full rounded-lg bg-green-600 hover:bg-green-700 py-3 font-semibold"
        >
          Login
        </button>

        <p class="text-center text-sm text-gray-400 mt-4">
          <span id="authSwitchText">Don't have an account?</span>
          <button
            id="switchAuthBtn"
            class="text-green-400 hover:text-green-300 font-medium"
          >
            Register
          </button>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
